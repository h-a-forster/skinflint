# skinflint price table. All rates are USD per million tokens (MTok).
#
# Per provider:
#   [<provider>.defaults]        cache multipliers of the input rate, used when a model omits a
#                                cache rate; web_search_per_1k in USD per 1,000 searches.
#   [<provider>.service_tier]    multipliers by the response's service_tier.
#   [<provider>.inference_geo]   multipliers by the response's inference_geo (Anthropic).
#   [<provider>.models."<id>"]   input, output, optional cache_write_5m / cache_write_1h /
#                                cache_read, aliases, long_context = {threshold, rates...}
#                                (whole request at long rates when prompt > threshold),
#                                fast = {rates...} (Anthropic usage.speed == "fast"),
#                                service_tier = {tier = multiplier} (per-model override).
#   fallback = "<model id>"        price used for unknown models (unknown_model = "max"):
#                                the most expensive current flagship, not a retired model.
# Tier rates (long_context, fast) that omit cache rates derive them from the model's own
# base cache-to-input ratios.
#
# Skipped as UNVERIFIED (no primary-source price as of as_of):
#   claude-3-haiku-20240307 (not on the pricing page)
#   Sonnet 4 / 4.5 >200k long-context premium (no longer listed)
#   gpt-5.1-codex-max, gpt-5.1-codex, gpt-5.1-codex-mini, gpt-5-codex
#   OpenAI "ultrafast" tier (6x on gpt-6-astra / gpt-6.1-sol; tier string unknown)

[meta]
as_of = "2026-10-09"
anthropic_source = "https://platform.claude.com/docs/en/about-claude/pricing"
anthropic_release_notes = "https://platform.claude.com/docs/en/release-notes/api"
openai_source = "https://developers.openai.com/api/docs/pricing"

# ---------------------------------------------------------------------------------------------
