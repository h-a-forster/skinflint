[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "skinflint"
version = "0.1.0"
description = "Local proxy for the Anthropic and OpenAI APIs: hard spend caps, per-request context breakdown, and prompt-cache miss diagnosis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "skinflint contributors" }]
keywords = ["llm", "proxy", "anthropic", "openai", "claude-code", "codex", "budget", "tokens", "prompt-caching", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["aiohttp>=3.13.2", "backports.zstd>=1.0; python_version < \"3.14\""]

[project.urls]
Homepage = "https://github.com/OWNER/skinflint"
Issues = "https://github.com/OWNER/skinflint/issues"
Changelog = "https://github.com/OWNER/skinflint/blob/main/CHANGELOG.md"

[project.scripts]
skinflint = "skinflint.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/skinflint"]

[tool.hatch.build.targets.sdist]
include = ["src/skinflint", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
