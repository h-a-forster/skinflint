name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

  package:
    name: build and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Install the wheel into a fresh virtual environment
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          if [ -d "$RUNNER_TEMP/smoke/Scripts" ]; then
            echo "$RUNNER_TEMP/smoke/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/smoke/bin" >> "$GITHUB_PATH"
          fi

      - name: Smoke test the CLI against a fake upstream
        working-directory: ${{ runner.temp }}
        env:
          SKINFLINT_HOME: ${{ runner.temp }}/skinflint-home
        run: |
          set -euxo pipefail
          skinflint --version
          skinflint init
          skinflint prices claude-sonnet-5-5
          python "$GITHUB_WORKSPACE/scripts/smoke.py"

      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
